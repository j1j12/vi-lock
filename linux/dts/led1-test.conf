# Manual sysboot test only. Do not replace the normal extlinux configuration.
menu title PI0 LED release test - NO SERVO
TIMEOUT 100
DEFAULT original
LABEL original
    MENU LABEL Original RGB boot (fallback)
    KERNEL /uImage
    FDT /stm32mp157d-atk.dtb
    INITRD /uInitrd
    APPEND root=/dev/mmcblk2p3 rootwait rw console=ttySTM0,115200
LABEL led1-off
    MENU LABEL Test RGB boot - led1 disabled
    KERNEL /uImage
    FDT /stm32mp157d-atk-led1-off.dtb
    INITRD /uInitrd
    APPEND root=/dev/mmcblk2p3 rootwait rw console=ttySTM0,115200
